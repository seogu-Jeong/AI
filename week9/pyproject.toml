[project]
name = "mechanics-solver"
version = "0.1.0"
description = "FastAPI web app for solving classical mechanics problems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "scipy>=1.14",
    "plotly>=5.24",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
